<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F4B52E"/>
      <stop offset="50%" stopColor="#C96B3B"/>
      <stop offset="100%" stopColor="#4A2412"/>
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFDE8A"/>
      <stop offset="50%" stopColor="#D97706"/>
      <stop offset="100%" stopColor="#8C4610"/>
    </linearGradient>
  </defs>

  <!-- Background Circle for contrast in browser tabs -->
  <circle cx="32" cy="32" r="30" fill="#2E1408" stroke="#F4B52E" stroke-width="2.5"/>

  <!-- Crown on top of cup -->
  <path d="M22 17 L25 22 L32 15 L39 22 L42 17 L40 25 L24 25 Z" fill="#F4B52E" stroke="#FFE494" stroke-width="0.8"/>
  <circle cx="22" cy="16" r="1.5" fill="#FFE494"/>
  <circle cx="32" cy="14" r="1.8" fill="#FFE494"/>
  <circle cx="42" cy="16" r="1.5" fill="#FFE494"/>

  <!-- Steam curves -->
  <path d="M26 23 C24 21 28 19 26 17" fill="none" stroke="#FFE5B4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M32 22 C30 20 34 18 32 16" fill="none" stroke="#FFE5B4" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M38 23 C36 21 40 19 38 17" fill="none" stroke="#FFE5B4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Chai Cutting Glass / Cup -->
  <path d="M18 28 L22 51 C22.5 53.5 25 55 32 55 C39 55 41.5 53.5 42 51 L46 28 Z" fill="url(#cupGrad)" stroke="#FFE494" stroke-width="2" stroke-linejoin="round"/>

  <!-- Chai liquid fill -->
  <path d="M20 34 L23 49 C23.5 51 26 52 32 52 C38 52 40.5 51 41 49 L44 34 Z" fill="url(#teaGrad)"/>

  <!-- Glass Rim Top -->
  <ellipse cx="32" cy="28" rx="14" ry="3.5" fill="#FFE494" stroke="#4A2412" stroke-width="1.5"/>

  <!-- Foam / Malai inside cup -->
  <ellipse cx="32" cy="34" rx="11" ry="2.5" fill="#FFF2D6" stroke="#D97706" stroke-width="1"/>
</svg>
